version: "3"
services:
  dotnet_core:
    platform: linux/amd64
    build:
      context: .
    container_name: dotnet_core_core

    depends_on:
      - mysql
      - redis
      - kafka
      - otel-collector


    environment:
      # dd-trace-dotnet
      - DD_TRACE_ENABLED=true
      - DD_SERVICE=sample_dotnet_core_dd
      - DD_ENV=dev
      - DD_VERSION=1.0.0
      - DD_TRACE_AGENT_URL=http://otel-collector:8126
      - DD_TRACE_DEBUG=true

      # Enable profiler for auto-instrumentation
      - CORECLR_ENABLE_PROFILING=1
      - CORECLR_PROFILER={846F5F1C-F9AE-4B07-969E-05C26BC060D8}
      - CORECLR_PROFILER_PATH=/opt/datadog/Datadog.Trace.ClrProfiler.Native.so
      - DD_DOTNET_TRACER_HOME=/opt/datadog
      - DD_TRACE_REDIS_ENABLED=true
      - DD_TRACE_MYSQL_ENABLED=true
      - DD_TRACE_KAFKA_ENABLED=true
      # OpenTelemetry (metrics/logs only; prevent duplicate traces)
      - OTEL_SERVICE_NAME=sample_dotnet_core_otel
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      # - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp

    ports:
      - "8080:8080"
    restart: always

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-config.yaml"]
    volumes:
      - ./otel-collector-config-dd.yaml:/etc/otelcol-config.yaml
      - otel-storage:/var/lib/otelcol
    user: "0:0"
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8126:8126"
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: dotnet_core_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=test
    volumes:
      - dotnet_core_mysql:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:alpine3.18
    container_name: dotnet_core_redis

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dotnet_core_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.0
    container_name: dotnet_core_kafdrop
    depends_on:
      - kafka
    ports:
      - 19000:9000
    environment:
      KAFKA_BROKERCONNECT: kafka:29092

volumes:
  dotnet_core_mysql:
  otel-storage: {}
