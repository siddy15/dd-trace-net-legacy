  # transform/db_spanmetrics:
  #   error_mode: silent
  #   trace_statements:
  #     - context: span
  #       statements:
  #         - set(attributes["db.namespace"], attributes["db.name"]) where attributes["db.namespace"]== nil
  #         - set(attributes["db.namespace"], attributes["server.address"]) where attributes["db.namespace"]== nil
  #         - set(attributes["db.namespace"], attributes["network.peer.name"]) where attributes["db.namespace"]== nil
  #         - set(attributes["db.namespace"], attributes["net.peer.name"]) where attributes["db.namespace"]== nil
  #         - set(attributes["db.namespace"], attributes["db.system"]) where attributes["db.namespace"]== nil
  #         - set(attributes["db.operation.name"], attributes["db.operation"]) where attributes["db.operation.name"]== nil
  #         - set(attributes["db.collection.name"], attributes["db.sql.table"]) where attributes["db.collection.name"]== nil
  #         - set(attributes["db.collection.name"], attributes["db.cassandra.table"]) where attributes["db.collection.name"] == nil
  #         - set(attributes["db.collection.name"], attributes["db.mongodb.collection"]) where attributes["db.collection.name"] == nil
  #         - set(attributes["db.collection.name"], attributes["db.redis.database_index"]) where attributes["db.collection.name"] == nil
  #         - set(attributes["db.collection.name"], attributes["db.elasticsearch.path_parts.index"]) where attributes["db.collection.name"] == nil
  #         - set(attributes["db.collection.name"], attributes["db.cosmosdb.container"]) where attributes["db.collection.name"] == nil
  #         - set(attributes["db.collection.name"], attributes["aws_dynamodb.table_names"]) where attributes["db.collection.name"] == nil
  transform/db_spanmetrics:
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - attributes["db.system"] != nil 
        statements:
          - set(attributes["db.namespace"], attributes["db.name"]) where attributes["db.namespace"] == nil
          - set(attributes["db.namespace"], attributes["db.system"]) where attributes["db.namespace"] == nil
          - set(attributes["db.operation.name"], attributes["db.operation"]) where attributes["db.operation.name"] == nil
          - set(attributes["db.collection.name"], attributes["db.namespace"]) where attributes["db.collection.name"] == nil 
          - set(attributes["db.collection.name"], attributes["db.sql.table"]) where attributes["db.collection.name"] == nil
          - set(attributes["db.collection.name"], attributes["db.cassandra.table"]) where attributes["db.collection.name"] == nil
          - set(attributes["db.collection.name"], attributes["db.mongodb.collection"]) where attributes["db.collection.name"] == nil
          - set(attributes["db.collection.name"], attributes["db.elasticsearch.path_parts.index"]) where attributes["db.collection.name"] == nil
          - set(attributes["db.collection.name"], attributes["db.cosmosdb.container"]) where attributes["db.collection.name"] == nil
          - set(attributes["db.collection.name"], attributes["aws.dynamodb.table_names"]) where attributes["db.collection.name"] == nil
  transform/dd_mysql_to_otel:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # Map "db.system.name" -> "db.system" (what your filters/spanmetrics expect)
          - set(attributes["db.system"], attributes["db.system.name"]) where attributes["db.system"] == nil and attributes["db.system.name"] != nil

          # Ensure db.namespace exists (your spanmetrics/db uses it heavily)
          - set(attributes["db.namespace"], attributes["db.name"]) where attributes["db.namespace"] == nil and attributes["db.name"] != nil

          # Map SQL text from Datadog resource -> OTel db.query.text
          - set(attributes["db.query.text"], attributes["dd.span.Resource"]) where attributes["db.query.text"] == nil and attributes["dd.span.Resource"] != nil

          # Optional: host mapping
          - set(attributes["server.address"], attributes["out.host"]) where attributes["server.address"] == nil and attributes["out.host"] != nil
  transform/dd_redis_to_otel:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # Identify redis spans by component or operation name
          - set(attributes["db.system"], "redis")
            where attributes["db.system"] == nil and (attributes["component"] == "StackExchangeRedis" or name == "redis.command")

          # Provide a namespace so spanmetrics/db has something consistent
          # If you have "out.host" (redis service name), use it
          - set(attributes["db.namespace"], attributes["out.host"])
            where attributes["db.namespace"] == nil and attributes["out.host"] != nil and (attributes["component"] == "StackExchangeRedis" or name == "redis.command")

          # If not, use server.address
          - set(attributes["db.namespace"], attributes["server.address"])
            where attributes["db.namespace"] == nil and attributes["server.address"] != nil and (attributes["component"] == "StackExchangeRedis" or name == "redis.command")

          # Optionally map redis db index into db.namespace if you prefer (optional)
          # - set(attributes["db.namespace"], Concat(["db", attributes["db.redis.database_index"]], ""))
          #   where attributes["db.namespace"] == nil and attributes["db.redis.database_index"] != nil and (attributes["component"] == "StackExchangeRedis" or name == "redis.command")

  transform/spanmetrics:
    error_mode: silent
    metric_statements:
    - context: datapoint
      statements:
      - set(attributes["status.code"], "STATUS_CODE_ERROR") where attributes["status.code"]
        == nil and attributes["span.name"] != nil and attributes["otel.status_code"]
        == "ERROR"
      - set(attributes["status.code"], "STATUS_CODE_OK") where attributes["status.code"]
        == nil and attributes["span.name"] != nil and attributes["otel.status_code"]
        == "OK"
      - set(attributes["status.code"], "STATUS_CODE_UNSET") where attributes["status.code"]
        == nil and attributes["span.name"] != nil and (attributes["otel.status_code"]
        == "UNSET" or attributes["otel.status_code"] == nil)
  transform/spanmetrics_labels:
    error_mode: ignore
    metric_statements:
      - conditions:
          - IsMatch(name, "calls")
          - IsMatch(name, "duration")
          - IsMatch(name, "db_calls")
          - IsMatch(name, "db_duration")
        context: metric
        statements:
          - delete_key(resource.attributes, "telemetry.sdk.name")
          - delete_key(resource.attributes, "telemetry.sdk.language")
          - delete_key(resource.attributes, "telemetry.sdk.version")
  transform/semconv:
    error_mode: ignore
    trace_statements:
    - context: span
      statements:
      - set(attributes["http.method"], attributes["http.request.method"]) where attributes["http.request.method"]
        != nil

  tail_sampling:
    decision_cache:
      non_sampled_cache_size: 0
      sampled_cache_size: 0
    decision_wait: 30s
    expected_new_traces_per_sec: 0
    num_traces: 50000
    policies:
      [
        {
          name: errors-policy,
          type: status_code,
          status_code: { status_codes: [ERROR] },
        },
        {
          name: randomized-policy,
          type: probabilistic,
          probabilistic: { sampling_percentage: 100 },
        },
      ]

exporters:
  debug:
    verbosity: detailed
  coralogix:
    domain: "app.coralogix.in"
    private_key: "cxtp_2GlwDoHsoeRSdtAiQ4OnKS4EFvo0yP"
    application_name: "sample_dotnet_core_otel"
    subsystem_name: "sample_dotnet_core_otel"
    # These configuration values can be used to dynamically set the application_name and subsystem_name
    # application_name_attributes:
    # - host.id
    subsystem_name_attributes:
      - host.name
    timeout: 30s
  coralogix/resource_catalog:
    application_name: resource
    domain: "app.coralogix.in"
    private_key: "cxtp_2GlwDoHsoeRSdtAiQ4OnKS4EFvo0yP"
    logs:
      headers:
        X-Coralogix-Distribution: ec2-local-integration/0.0.1
        x-coralogix-ingress: metadata-as-otlp-logs/v1
    subsystem_name: catalog
    timeout: 30s

extensions:
  file_storage:
    directory: /var/lib/otelcol/storage
    create_directory: true 

service:
  extensions:
    - file_storage
  telemetry:
    logs:
      encoding: json
      level: 'debug'
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: localhost
                port: 8888
  pipelines:
    logs:
      receivers:
        - filelog
      processors:
        - resourcedetection
        - batch
      exporters:
        - coralogix
    metrics:
      exporters:
      - coralogix
      processors:
      - memory_limiter
      - resourcedetection
      # - resourcedetection/env
      - resource/metadata
      - transform/spanmetrics
      # - transform/reduce
      # - transform/prometheus
      - batch
      receivers:
      - hostmetrics
      - spanmetrics
      - spanmetrics/db
      # - prometheus
      - otlp
    metrics/compact:
      exporters:
      - coralogix
      processors:
      - memory_limiter
      - transform/spanmetrics
      - batch
      receivers:
      - spanmetrics/compact
    metrics/db_compact:
      exporters:
      - coralogix
      processors:
      - memory_limiter
      - transform/spanmetrics
      - batch
      receivers:
      - spanmetrics/db_compact
    traces:
      receivers:
        - otlp
        - datadog
      processors:
        - resourcedetection
        - transform/dd_redis_to_otel
        - transform/dd_mysql_to_otel
        # - transform/add_route_to_service
        # - transform/testregexspanname
        - transform/db_spanmetrics
        - redaction/spanname
        - transform/semconv
        - batch
      exporters:
        - spanmetrics
        - forward/db
        - forward/compact
        - forward/db_compact
        - forward/sampled
        - debug
        - coralogix
    traces/compact:
      exporters:
      - spanmetrics/compact
      processors:
      - transform/compact
      - batch
      receivers:
      - forward/compact
    traces/sampling:
      exporters:
        - coralogix
      processors:
        - tail_sampling
        - batch
      receivers:
        - forward/sampled
    traces/db:
      exporters:
        - spanmetrics/db
      processors:
        - filter/db_spanmetrics
        - transform/db
        - batch
      receivers:
        - forward/db
    traces/db_compact:
      exporters:
      - spanmetrics/db_compact
      processors:
      - filter/db_compact_spanmetrics
      - transform/db_compact
      - batch
      receivers:
      - forward/db_compact
    logs/resource_catalog:
      exporters:
        - coralogix/resource_catalog
      processors:
        - memory_limiter
        - resource/metadata
        - resourcedetection/entity
        - transform/entity-event
      receivers:
        - hostmetrics

