connectors:
  forward/compact: {}
  forward/db: {}
  forward/db_compact: {}
  forward/sampled: {}
  spanmetrics:
    dimensions:
      - name: http.method
      - name: cgx.transaction
      - name: cgx.transaction.root
      - name: status_code
      - name: http.response.status_code
      - name: rpc.grpc.status_code
      - name: service.version
      - name: db.system
      - name: db.namespace
    histogram:
      explicit:
        buckets:
          - 1ms
          - 4ms
          - 10ms
          - 20ms
          - 50ms
          - 100ms
          - 200ms
          - 500ms
          - 1s
          - 2s
          - 5s
    metrics_expiration: 5m
    metrics_flush_interval: '30s'
    namespace: ''
  spanmetrics/compact:
    add_resource_attributes: true
    aggregation_cardinality_limit: 100000
    exclude_dimensions:
    - span.name
    histogram:
      explicit:
        buckets:
        - 1ms
        - 4ms
        - 10ms
        - 20ms
        - 50ms
        - 100ms
        - 200ms
        - 500ms
        - 1s
        - 2s
        - 5s
      unit: ms
    metrics_expiration: 5m
    metrics_flush_interval: '30s'
    namespace: compact
  spanmetrics/db:
    dimensions:
      - name: db.namespace
      - name: db.operation.name
      - name: db.collection_name
      - name: db.system
      - name: service.version
    histogram:
      explicit:
        buckets:
          - 100us
          - 1ms
          - 2ms
          - 2.5ms
          - 4ms
          - 6ms
          - 10ms
          - 100ms
          - 250ms
    metrics_expiration: 5m
    metrics_flush_interval: '30s'
    namespace: db
  spanmetrics/db_compact:
    add_resource_attributes: true
    aggregation_cardinality_limit: 100000
    dimensions:
    - name: db.namespace
    - name: db.system
    exclude_dimensions:
    - span.name
    - span.kind
    histogram:
      explicit:
        buckets:
        - 1ms
        - 4ms
        - 10ms
        - 20ms
        - 50ms
        - 100ms
        - 200ms
        - 500ms
        - 1s
        - 2s
        - 5s
      unit: ms
    metrics_expiration: 5m
    metrics_flush_interval: '30s'
    namespace: db_compact
receivers:
  datadog:
    endpoint: 0.0.0.0:8126
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
  filelog:
    force_flush_period: 0
    include:
    - /var/log/syslog
    - /var/log/supervisor/*.log
    - /home/ec2-user/logs/*/*/*/*/*.log
    include_file_name: true
    include_file_path: false
    retry_on_failure:
      enabled: true
    start_at: beginning
    storage: file_storage
  hostmetrics:
    root_path: /
    collection_interval: 60s
    scrapers:
      cpu: { metrics: { system.cpu.utilization: { enabled: true } } }
      filesystem:
        exclude_fs_types:
          {
            fs_types:
              [
                autofs,
                binfmt_misc,
                bpf,
                cgroup2,
                configfs,
                debugfs,
                devpts,
                devtmpfs,
                fusectl,
                hugetlbfs,
                iso9660,
                mqueue,
                nsfs,
                overlay,
                proc,
                procfs,
                pstore,
                rpc_pipefs,
                securityfs,
                selinuxfs,
                squashfs,
                sysfs,
                tracefs,
              ],
            match_type: strict,
          }
        exclude_mount_points:
          {
            match_type: regexp,
            mount_points:
              [
                /dev/*,
                /proc/*,
                /sys/*,
                /run/k3s/containerd/*,
                /run/containerd/runc/*,
                /var/lib/docker/*,
                /var/lib/kubelet/*,
                /snap/*,
              ],
          }
      memory: { metrics: { system.memory.utilization: { enabled: true } } }
      network:
      process:
        metrics:
          process.cpu.utilization: { enabled: true }
          process.memory.utilization: { enabled: true }
          process.threads: { enabled: true }
        mute_process_all_errors: true
        mute_process_exe_error: true
        mute_process_user_error: true

processors:
  batch: { send_batch_max_size: 2048, send_batch_size: 1024, timeout: 1s }
  filter/db_compact_spanmetrics:
    traces:
      span:
      - kind != SPAN_KIND_CLIENT or attributes["db.namespace"] == nil or attributes["db.system"] == nil 
  filter/db_spanmetrics:
    traces:
      span:
        - attributes["db.system"] == nil 
  memory_limiter:
    check_interval: 1s
    limit_mib: 1000
    spike_limit_mib: 800
  redaction/spanname:
    allow_all_keys: true
    db_sanitizer: null
    url_sanitizer:
      enabled: true
  resourcedetection:
    detectors: [system, env, ec2]
    override: false
    timeout: 2s
  resource/metadata:
    attributes:
      - action: upsert
        key: cx.otel_integration.name
        value: coralogix-integration-OTEL-EC2-service
  resourcedetection/entity:
    detectors: [system, env, ec2, ecs]
    override: false
    timeout: 2s
    system:
      resource_attributes:
        host.id: { enabled: false }
        host.cpu.cache.l2.size: { enabled: true }
        host.cpu.stepping: { enabled: true }
        host.cpu.model.name: { enabled: true }
        host.cpu.model.id: { enabled: true }
        host.cpu.family: { enabled: true }
        host.cpu.vendor.id: { enabled: true }
        host.mac: { enabled: true }
        host.ip: { enabled: true }
        os.description: { enabled: true }
  transform/compact:
    trace_statements:
    - context: resource
      statements:
      - keep_keys(attributes, ["service.name", "k8s.cluster.name", "host.name", "deployment.environment.name"])
  transform/db_compact:
    trace_statements:
    - context: resource
      statements:
      - keep_keys(attributes, ["service.name", "k8s.cluster.name", "host.name", "deployment.environment.name"])
    - context: span
      statements:
      - keep_keys(attributes, ["db.namespace", "db.system"])
  transform/entity-event:
    error_mode: silent
    log_statements:
      - context: log
        statements:
          - set(attributes["otel.entity.id"]["host.id"], resource.attributes["host.id"])
          - merge_maps(attributes, resource.attributes, "insert")
      - context: resource
        statements:
          - keep_keys(attributes, [""])
  transform/db:
    error_mode: silent
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["db.query.text"], "\\d+", "?")
          - set(attributes["span.duration_ns"], end_time_unix_nano - start_time_unix_nano)
